# Non-sequential pruning depth distillation on Flux.2 Klein base 4B.
# This follows the Qwen-style interval compression setup: each pruned interval
# is replaced by one LoRA-augmented student block, initialized from the
# interval midpoint by default.
extends: base.yaml

dataset:
  class_name: nexus.data.precomputed_sstk_dataset:PrecomputedSSTKDataset
  kwargs:
    local: null
    resolution: 512
    shuffle: true

collate:
  class_name: nexus.data.precomputed_sstk_dataset:collate_precomputed

model:
  dit:
    class_name: diffusers:Flux2Transformer2DModel
    subfolder: transformer

train_mode: lora

train:
  batch_size: 4
  max_steps: 1000
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  learning_rate: 1.0e-4
  guidance_scale: 3.5
  scale_lr: false
  lr_scheduler: constant
  lr_warmup_steps: 500
  lr_num_cycles: 1
  lr_power: 1.0
  dataloader_num_workers: 0

loss:
  class_name: nexus.losses:PruningDepthDistillationLoss
  weighting_scheme: none
  logit_mean: 0.0
  logit_std: 1.0
  kwargs:
    pretrained_model_name_or_path: black-forest-labs/FLUX.2-klein-base-4B
    depth_weight: 1.0
    lora_rank: 128
    student_block_init: midpoint
    pruned_blocks:
      - ["d1", "d2"]
      - ["s2", "s4"]

optimizer:
  class_name: torch.optim:AdamW
  kwargs:
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    eps: 1.0e-8
max_grad_norm: 1.0

validation:
  steps: 500
  prompt: null
  seed: 42

checkpointing_steps: 500
resume_from_checkpoint: null
seed: null

allow_tf32: false

mlflow:
  experiment_name: klein4b-base-t2i-pruning-depth-distillation
  run_name: batch4-intervals
  user: null
